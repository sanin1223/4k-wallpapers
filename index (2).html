<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4K Photo Gallery</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
}

/* SIGNUP PAGE */

#signupPage{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#1e293b);
}

.signup-box{
  width:350px;
  background:#1e293b;
  padding:40px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.signup-box h1{
  text-align:center;
  margin-bottom:25px;
  color:#22c55e;
}

.signup-box input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
  outline:none;
}

.signup-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.signup-box button:hover{
  background:#16a34a;
}

/* WEBSITE */

#website{
  display:none;
}

header{
  background:#111827;
  padding:20px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:1000;
}

header h1{
  font-size:40px;
  color:#22c55e;
}

.hero{
  width:100%;
  height:70vh;
  background:url('https://picsum.photos/id/1018/1920/1080') center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-content{
  background:rgba(0,0,0,0.5);
  padding:40px;
  border-radius:20px;
}

.hero-content h2{
  font-size:55px;
}

.hero-content p{
  margin-top:10px;
  color:#cbd5e1;
}

.categories{
  text-align:center;
  padding:30px;
}

.filter-btn{
  padding:12px 20px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.filter-btn:hover{
  background:#16a34a;
}

.gallery{
  padding:40px 5%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
}

.photo-card{
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
  transition:0.3s;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
}

.photo-card:hover{
  transform:translateY(-8px) scale(1.02);
}

.photo-card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.photo-info{
  padding:20px;
}

.photo-info h3{
  margin-bottom:10px;
  color:#22c55e;
}

.photo-info p{
  color:#cbd5e1;
}

.download-btn{
  display:inline-block;
  margin-top:15px;
  padding:10px 18px;
  background:#22c55e;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

.download-btn:hover{
  background:#16a34a;
}

footer{
  text-align:center;
  padding:20px;
  background:#111827;
  margin-top:30px;
  color:#94a3b8;
}

</style>

</head>

<body>

<!-- SIGNUP PAGE -->

<div id="signupPage">

  <div class="signup-box">

    <h1>Create Account</h1>

    <input type="text" id="name" placeholder="Enter Name">

    <input type="email" id="email" placeholder="Enter Email">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="signup()">
      Sign Up
    </button>

  </div>

</div>

<!-- WEBSITE -->

<div id="website">

<header>

  <h1>4K Wallpaper Gallery</h1>

</header>

<section class="hero">

  <div class="hero-content">

    <h2>Explore 4K Wallpapers</h2>

    <p>
      Nature • Cars • Bikes • Space • City
    </p>

  </div>

</section>

<section class="categories">

  <button class="filter-btn" onclick="showPhotos('all')">
    All
  </button>

  <button class="filter-btn" onclick="showPhotos('nature')">
    Nature
  </button>

  <button class="filter-btn" onclick="showPhotos('cars')">
    Cars
  </button>

  <button class="filter-btn" onclick="showPhotos('bikes')">
    Bikes
  </button>

  <button class="filter-btn" onclick="showPhotos('space')">
    Space
  </button>

  <button class="filter-btn" onclick="showPhotos('city')">
    City
  </button>

</section>

<section class="gallery" id="gallery"></section>

<footer>

  © 2026 4K Gallery | Designed by Sani

</footer>

</div>

<script>

/* SIGNUP */

function signup(){

  let name =
    document.getElementById('name').value;

  let email =
    document.getElementById('email').value;

  let password =
    document.getElementById('password').value;

  if(
    name === '' ||
    email === '' ||
    password === ''
  ){

    alert('Please fill all fields');

  }else{

    document.getElementById(
      'signupPage'
    ).style.display = 'none';

    document.getElementById(
      'website'
    ).style.display = 'block';

  }

}

/* PHOTO SYSTEM */

const gallery =
  document.getElementById('gallery');

const photos = [];

const categories = [
  'nature',
  'cars',
  'bikes',
  'space',
  'city'
];

/* GENERATE 1,000,000 PHOTOS */

for(let i = 1; i <= 1000000; i++){

  let category =
    categories[i % categories.length];

  photos.push({

    title:
      category.toUpperCase() +
      ' Wallpaper ' + i,

    category: category,

    image:
      `https://picsum.photos/seed/${i}/600/400`

  });

}

/* SHOW PHOTOS */

function showPhotos(category){

  gallery.innerHTML = '';

  let filteredPhotos;

  if(category === 'all'){

    filteredPhotos =
      photos.slice(0,50);

  }else{

    filteredPhotos =
      photos
      .filter(
        photo =>
        photo.category === category
      )
      .slice(0,50);

  }

  filteredPhotos.forEach(photo => {

    gallery.innerHTML += `

      <div class="photo-card">

        <img
          src="${photo.image}"
          alt="${photo.title}"
        >

        <div class="photo-info">

          <h3>
            ${photo.title}
          </h3>

          <p>
            Category:
            ${photo.category}
          </p>

          <a
            href="${photo.image}"
            download
            class="download-btn"
          >
            Download
          </a>

        </div>

      </div>

    `;

  });

}

/* LOAD ALL */

showPhotos('all');

</script>

</body>
</html>
```
